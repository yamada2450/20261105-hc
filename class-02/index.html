<!DOCTYPE html>
<html lang="jp">

<head>
    <meta charset="UTF-8">
    <title>クラスによる場合分け（お知らせ一覧）</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>NEWS</h1>
        <p>お知らせ</p>

        <div class="container">
            <div class="container">
                <div class="news">
                    <p class="category service">サービス</p>
                    <p class="date">2026.11.01</p>
                    <h2>新サービスのお知らせ</h2>
                    <p>新しいオンラインサービスの提供を開始しました。</p>
                </div>

                <div class="news">
                    <p class="category important">重要</p>
                    <p class="date">2026.10.20</p>
                    <h2>営業時間変更のお知らせ</h2>
                    <p>来月より営業時間を一部変更いたします。</p>
                </div>

                <div class="news">
                    <p class="category event">イベント</p>
                    <p class="date">2026.10.10</p>
                    <h2>秋のキャンペーン開催</h2>
                    <p>期間限定のキャンペーンを開催いたします。</p>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
